name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Install Chromium for browser tests
        run: mvn -B -q exec:java -Dexec.args="install --with-deps chromium"
      - name: Browser tests (fills sample application forms)
        run: mvn -B test -Dgroups=browser -Dsurefire.excludedGroups= 2>&1 | tee -a build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Summarize failures
        if: failure()
        run: |
          {
            grep -E "\[ERROR\]" build.log | grep -vE "To see the full stack|Re-run Maven|Help 1|^\[ERROR\] *$|For more information" | head -60
            for f in target/surefire-reports/*.txt; do grep -A6 -E "FAILURE|ERROR" "$f" | head -30; done 2>/dev/null
          } > failures.txt || true
          body=$(sed 's/%/%25/g' failures.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failures::${body}"
      - name: Preview resume
        run: |
          gzip -9c target/resume-sample.pdf | base64 -w0 | fold -w 4000 > chunks.txt
          wc -l chunks.txt
          n=0; while read -r c; do n=$((n+1)); echo "::notice title=resume-b64-$n::$c"; done < chunks.txt
      - name: Upload sample resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-sample
          path: target/resume-sample.pdf
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t job-radar:ci .
