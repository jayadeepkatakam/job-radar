name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Install Chromium for browser tests
        run: mvn -B -q exec:java -Dexec.args="install --with-deps chromium"
      - name: Browser tests (fills sample application forms)
        run: mvn -B test -Dgroups=browser -Dsurefire.excludedGroups= 2>&1 | tee -a build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Summarize failures
        if: failure()
        run: |
          {
            grep -E "\[ERROR\]" build.log | grep -vE "To see the full stack|Re-run Maven|Help 1|^\[ERROR\] *$|For more information" | head -60
            for f in target/surefire-reports/*.txt; do grep -A6 -E "FAILURE|ERROR" "$f" | head -30; done 2>/dev/null
          } > failures.txt || true
          body=$(sed 's/%/%25/g' failures.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failures::${body}"
      - name: Preview resume
        run: |
          cp target/resume-sample.pdf /tmp/resume-sample.pdf
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan preview-out && git rm -rqf . && cp /tmp/resume-sample.pdf .
          git add resume-sample.pdf && git commit -qm preview && git push -f origin preview-out
      - name: Upload sample resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-sample
          path: target/resume-sample.pdf
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t job-radar:ci .
