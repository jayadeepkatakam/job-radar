name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Install Chromium for browser tests
        run: mvn -B -q exec:java -Dexec.args="install --with-deps chromium"
      - name: Browser tests (fills sample application forms)
        run: mvn -B test -Dgroups=browser -Dsurefire.excludedGroups=
      - name: Upload sample resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-sample
          path: target/resume-sample.pdf
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t job-radar:ci .
