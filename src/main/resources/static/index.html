<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #616875; --line: #e3e6eb;
    --accent: #2f5bd3; --apply: #1d7a46; --maybe: #9a6a00; --skip: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --panel: #1a1d23; --text: #e8eaee; --muted: #9aa1ad; --line: #2b2f37;
            --accent: #7c9cff; --apply: #4cc283; --maybe: #e0b341; --skip: #f2786d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: progress; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .status-line { color: var(--muted); font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px;
          display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: start; }
  .score { font-size: 22px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .score small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .APPLY { color: var(--apply); } .MAYBE { color: var(--maybe); } .SKIP { color: var(--skip); }
  .title { font-weight: 600; }
  .title a { color: inherit; }
  .meta, .reason { color: var(--muted); font-size: 13px; }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .flag { font-size: 12px; border: 1px solid var(--skip); color: var(--skip); border-radius: 999px; padding: 1px 8px; }
  .controls { display: grid; gap: 6px; min-width: 150px; }
  .controls input, .controls select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
           width: min(720px, calc(100vw - 32px)); max-height: 85vh; padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { display: grid; gap: 10px; }
  dialog input, dialog textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .desc { white-space: pre-wrap; font-size: 14px; }
  textarea.notes { width: 100%; min-height: 70px; }
  .banner { background: var(--panel); border: 1px solid var(--maybe); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  .banner:empty { display: none; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid currentColor; }
  .READY_FOR_REVIEW, .SUBMITTED { color: var(--apply); } .NEEDS_INPUT, .WAITING_FOR_SIGN_IN { color: var(--maybe); }
  .FAILED { color: var(--skip); } .PREPARING, .FILLING, .CANCELLED { color: var(--muted); }
  .app { grid-template-columns: 1fr auto; }
  table.report { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.report td { border-top: 1px solid var(--line); padding: 5px 6px; vertical-align: top; }
  table.report tr.flag td:first-child { box-shadow: inset 3px 0 var(--maybe); }
  table.report .v { max-width: 340px; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  @media (max-width: 640px) {
    .card { grid-template-columns: 48px 1fr; }
    .controls { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Job Radar</h1>
  <div style="display:flex;gap:8px">
    <button id="applyNew">Apply to a job</button>
    <button id="add">Add a job</button>
    <button id="run" class="primary">Fetch new jobs</button>
  </div>
</header>
<main>
  <div class="banner" id="banner"></div>
  <div class="tabs" id="tabs"></div>
  <div class="status-line" id="status"></div>
  <div id="list"></div>
</main>

<dialog id="detail"></dialog>

<dialog id="addDialog">
  <form id="addForm" method="dialog">
    <strong>Add a job you found elsewhere</strong>
    <input name="company" placeholder="Company" required>
    <input name="title" placeholder="Job title" required>
    <input name="location" placeholder="Location">
    <input name="url" placeholder="Link to the posting">
    <textarea name="description" rows="10" placeholder="Paste the full job description" required></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" id="cancelAdd">Cancel</button>
      <button class="primary" id="saveAdd">Screen and save</button>
    </div>
  </form>
</dialog>

<dialog id="applyDialog">
  <form id="applyForm" method="dialog">
    <strong>Apply to a job</strong>
    <span class="meta">The agent tailors your resume, opens the application in a browser window and fills it in.
      It stops before Submit so you can review everything first.</span>
    <input name="url" placeholder="Link to the job or application page (Greenhouse, Lever, Ashby, Workday)" required>
    <input name="company" placeholder="Company" required>
    <input name="title" placeholder="Job title" required>
    <textarea name="description" rows="9" placeholder="Paste the full job description" required></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" id="cancelApply">Cancel</button>
      <button class="primary" id="startApply">Start</button>
    </div>
  </form>
</dialog>

<script>
const STATUSES = ["NEW", "READY", "APPLIED", "INTERVIEW", "OFFER", "CLOSED"];
const APPS = "APPS";
let current = "NEW";
let pollTimer = null;
const ACTIVE = ["PREPARING", "FILLING", "WAITING_FOR_SIGN_IN"];
const STATUS_TEXT = { PREPARING: "Tailoring resume", FILLING: "Filling form", WAITING_FOR_SIGN_IN: "Sign in needed",
  READY_FOR_REVIEW: "Ready for your review", NEEDS_INPUT: "Needs your input", SUBMITTED: "Submitted",
  FAILED: "Failed", CANCELLED: "Cancelled" };

const $ = (sel) => document.querySelector(sel);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
};

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function renderTabs() {
  const tabs = [...STATUSES, APPS];
  $("#tabs").replaceChildren(...tabs.map(s =>
    el("button", { textContent: s === APPS ? "Applications" : s[0] + s.slice(1).toLowerCase(), ariaPressed: String(s === current),
                   onclick: () => { current = s; renderTabs(); load(); } })));
}

async function load() {
  clearTimeout(pollTimer);
  if (current === APPS) return loadApps();
  $("#status").textContent = "Loading…";
  try {
    const jobs = await api("/api/jobs?status=" + current);
    $("#status").textContent = jobs.length + " job" + (jobs.length === 1 ? "" : "s");
    $("#list").replaceChildren(...(jobs.length ? jobs.map(card) : [el("div", { className: "empty", textContent: "Nothing here yet." })]));
  } catch (e) {
    $("#status").textContent = "Couldn't load jobs: " + e.message;
  }
}

function card(job) {
  const verdict = job.verdict || "";
  const status = el("select", { onchange: () => patch(job.id, { status: status.value }, true) },
    STATUSES.map(s => el("option", { value: s, textContent: s[0] + s.slice(1).toLowerCase(), selected: s === job.status })));
  const follow = el("input", { type: "date", value: job.followUp || "", title: "Follow up on",
    onchange: () => patch(job.id, follow.value ? { followUp: follow.value } : { clearFollowUp: true }) });

  const titleLink = job.url
    ? el("a", { href: job.url, target: "_blank", rel: "noopener", textContent: job.title })
    : document.createTextNode(job.title);

  return el("div", { className: "card" },
    el("div", { className: "score " + verdict },
      job.fitScore ?? "–", el("small", { textContent: verdict })),
    el("div", {},
      el("div", { className: "title" }, titleLink),
      el("div", { className: "meta", textContent: [job.company, job.location, job.source].filter(Boolean).join(" · ") }),
      el("div", { className: "reason", textContent: job.fitReason || "" }),
      job.dealBreakers?.length ? el("div", { className: "flags" }, job.dealBreakers.map(d => el("span", { className: "flag", textContent: d }))) : "",
      job.notes ? el("div", { className: "meta", textContent: "Notes: " + job.notes }) : ""),
    el("div", { className: "controls" }, status, follow,
      el("button", { textContent: "Details", onclick: () => openDetail(job.id) }),
      job.url ? el("button", { className: "primary", textContent: "Apply", onclick: () => startApply({ jobId: job.id }) }) : ""));
}

async function patch(id, body, reload = false) {
  try {
    await api("/api/jobs/" + id, { method: "PATCH", body: JSON.stringify(body) });
    if (reload) load();
  } catch (e) {
    $("#status").textContent = "Couldn't save: " + e.message;
  }
}

async function openDetail(id) {
  const job = await api("/api/jobs/" + id);
  const notes = el("textarea", { className: "notes", value: job.notes || "", placeholder: "Notes: referral, recruiter, salary range…" });
  const d = $("#detail");
  d.replaceChildren(
    el("div", { className: "title", textContent: job.title + " — " + job.company }),
    el("p", { className: "reason", textContent: job.fitReason || "" }),
    notes,
    el("div", { style: "display:flex;gap:8px;justify-content:flex-end;margin:8px 0 14px" },
      el("button", { textContent: "Delete", onclick: async () => {
        if (!confirm("Delete this job?")) return;
        await api("/api/jobs/" + id, { method: "DELETE" }); d.close(); load(); } }),
      el("button", { textContent: "Close", onclick: () => d.close() }),
      el("button", { className: "primary", textContent: "Save notes", onclick: async () => {
        await patch(id, { notes: notes.value }); d.close(); load(); } })),
    el("div", { className: "desc", textContent: job.description || "No description." }));
  d.showModal();
}

$("#run").onclick = async () => {
  const btn = $("#run");
  btn.disabled = true; btn.textContent = "Fetching…";
  try {
    const r = await api("/api/ingest/run", { method: "POST" });
    $("#status").textContent = `Checked ${r.fetched} postings, added ${r.added} new` +
      (r.errors.length ? ` (${r.errors.length} board${r.errors.length === 1 ? "" : "s"} failed)` : "");
    current = "NEW"; renderTabs(); setTimeout(load, 0);
  } catch (e) {
    $("#status").textContent = "Fetch failed: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Fetch new jobs";
  }
};

$("#add").onclick = () => $("#addDialog").showModal();
$("#cancelAdd").onclick = () => $("#addDialog").close();
$("#addForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const btn = $("#saveAdd");
  btn.disabled = true; btn.textContent = "Scoring…";
  try {
    await api("/api/jobs", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(form))) });
    form.reset(); $("#addDialog").close();
    current = "NEW"; renderTabs(); load();
  } catch (e) {
    alert("Couldn't add: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Screen and save";
  }
};

async function startApply(body) {
  try {
    await api("/api/applications", { method: "POST", body: JSON.stringify(body) });
    current = APPS; renderTabs(); load();
  } catch (e) {
    alert("Couldn't start: " + e.message);
  }
}

async function loadApps() {
  try {
    const apps = await api("/api/applications");
    $("#status").textContent = apps.length ? apps.length + " application" + (apps.length === 1 ? "" : "s") : "";
    const cards = await Promise.all(apps.map(async a => appCard(ACTIVE.includes(a.status) || a.status === "NEEDS_INPUT" || a.status === "READY_FOR_REVIEW"
        ? await api("/api/applications/" + a.id) : a)));
    $("#list").replaceChildren(...(cards.length ? cards : [el("div", { className: "empty", textContent: "No applications yet. Press Apply on a job, or \"Apply to a job\"." })]));
    if (apps.some(a => ACTIVE.includes(a.status))) pollTimer = setTimeout(() => current === APPS && loadApps(), 3000);
  } catch (e) {
    $("#status").textContent = "Couldn't load applications: " + e.message;
  }
}

function appCard(a) {
  const act = (label, path, primary) => el("button", { className: primary ? "primary" : "", textContent: label,
    onclick: async () => { try { await api(`/api/applications/${a.id}/${path}`, { method: "POST" }); loadApps(); } catch (e) { alert(e.message); } } });
  const open = !["SUBMITTED", "CANCELLED"].includes(a.status);
  const report = (a.report || []).length ? el("table", { className: "report" },
    a.report.map(r => el("tr", { className: r.needsReview ? "flag" : "" },
      el("td", { textContent: r.label + (r.required ? " *" : "") }),
      el("td", { className: "v", textContent: r.value ? (r.kind === "file" ? "Resume uploaded" : r.value) : "—" }),
      el("td", { className: "meta", textContent: r.note || "" })))) : "";
  return el("div", { className: "card app" },
    el("div", {},
      el("div", { className: "title" }, a.title + " — " + a.company, " ",
        el("span", { className: "pill " + a.status, textContent: STATUS_TEXT[a.status] || a.status })),
      el("div", { className: "meta", textContent: a.ats + " · " + a.url }),
      el("div", { className: "reason", textContent: a.message || "" }),
      ...(a.tailorNotes || []).map(n => el("div", { className: "meta", textContent: "Resume: " + n })),
      report),
    el("div", { className: "controls" },
      a.hasResume ? el("a", { href: `/api/applications/${a.id}/resume`, target: "_blank", textContent: "View resume" }) : "",
      open && !ACTIVE.includes(a.status) ? act("Fill this page", "fill") : "",
      open ? act("I submitted it", "submitted", true) : "",
      open ? act("Cancel", "cancel") : ""));
}

async function loadProfile() {
  try {
    const p = await api("/api/profile/status");
    if (!p.configured) {
      $("#banner").textContent = "To use Apply, copy config/candidate.example.yml to config/candidate.yml, fill it in, and restart.";
    } else if (p.missing.length) {
      $("#banner").textContent = "In config/candidate.yml, these are still empty and will be left for you on every form: " + p.missing.join(", ") + ".";
    }
  } catch (e) { /* banner is optional */ }
}

$("#applyNew").onclick = () => $("#applyDialog").showModal();
$("#cancelApply").onclick = () => $("#applyDialog").close();
$("#applyForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const body = Object.fromEntries(new FormData(ev.target));
  $("#applyDialog").close();
  ev.target.reset();
  await startApply(body);
};

renderTabs();
load();
loadProfile();
</script>
</body>
</html>
